name: CI

# Trigger shape is the uW standard (dev-practices `ci-cd-workflows.md`):
# `pull_request` with NO base filter, plus `push` on `main` only.
#
# The `pull_request` filter is absent on purpose — that was the #330 bug. In an
# Actions filter glob `*` does not match `/`, so `branches: ["*"]` excluded any
# PR whose BASE contained a slash: a PR stacked on `docs/...` or `feat/...` got
# no checks at all, which is how #329 sat at "no checks reported" on 2026-09-11.
# An absent filter fires for every base, slashed or not. (Slash-free bases such
# as `docs-eod-2026-08-19` did match the old glob, so this was never literally
# "main-only" for PRs.)
#
# `push` is deliberately `main`-only rather than `"**"`. Running both events on
# every feature-branch push doubles the whole matrix — two gitleaks history
# scans and four `npm ci` installs per commit — for identical code, and posts
# two same-named checks whose gitleaks commit ranges differ (push scans only
# that push's commits; pull_request scans the whole PR). Local pre-commit hooks
# already run lint + typecheck + build, and this repo opens a PR straight after
# pushing, so pre-PR push coverage buys little.
#
# `edited` is here so retargeting a stacked PR onto `main` re-runs CI against
# the new merge base without needing a follow-up push. GitHub fires `edited`
# for title and body edits too, so every job gates on `changes.base.ref.from`,
# which is present only when the BASE changed.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Supersede stale runs rather than letting a fix -> push -> re-review cycle
# stack them up (dev-practices; `deploy-staging.yml` already does this).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Secret Scanning
  # ==========================================
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    # Only a BASE retarget re-runs CI on `edited`; a title or body edit must
    # not rebuild an unchanged SHA. `changes.base.ref.from` is set only on a
    # base change, and dereferencing it is empty for any other edit.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'edited' ||
      github.event.changes.base.ref.from != ''
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ==========================================
  # Code Quality Checks
  # ==========================================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    # Only a BASE retarget re-runs CI on `edited`; a title or body edit must
    # not rebuild an unchanged SHA. `changes.base.ref.from` is set only on a
    # base change, and dereferencing it is empty for any other edit.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'edited' ||
      github.event.changes.base.ref.from != ''

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Configure Font Awesome Pro
        run: |
          echo "@fortawesome:registry=https://npm.fontawesome.com/" >> .npmrc
          echo "//npm.fontawesome.com/:_authToken=${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (TypeScript)
        run: npm run typecheck

      - name: Test (Vitest worker pool)
        run: npm test

      - name: Security audit
        run: npm audit --omit=dev --audit-level=moderate

  # ==========================================
  # Build & Bundle Analysis
  # ==========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Configure Font Awesome Pro
        run: |
          echo "@fortawesome:registry=https://npm.fontawesome.com/" >> .npmrc
          echo "//npm.fontawesome.com/:_authToken=${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Report bundle size
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          if [ -d "dist" ]; then
            find dist -name "*.js" -o -name "*.css" | xargs du -h | sort -rh | head -10 | while read size file; do
              echo "| \`${file#dist/}\` | $size |" >> $GITHUB_STEP_SUMMARY
            done
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build completed successfully**" >> $GITHUB_STEP_SUMMARY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build
          path: dist
          retention-days: 1
