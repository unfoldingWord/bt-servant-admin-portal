name: Deploy Production

on:
  workflow_dispatch:

jobs:
  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Configure Font Awesome Pro
        run: |
          echo "@fortawesome:registry=https://npm.fontawesome.com/" >> .npmrc
          echo "//npm.fontawesome.com/:_authToken=${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Security audit
        run: npm audit --omit=dev --audit-level=moderate

  deploy:
    name: Deploy to Production
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Configure Font Awesome Pro
        run: |
          echo "@fortawesome:registry=https://npm.fontawesome.com/" >> .npmrc
          echo "//npm.fontawesome.com/:_authToken=${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Deploy to Cloudflare Workers (production)
        # #311 — one operator knob for every environment: the GitHub Actions
        # variable WHATSAPP_NUMBER (public by design; it is what the QR
        # encodes). When set it is injected with `--var` and wins over the
        # committed wrangler.jsonc value; when unset the committed value
        # ("" → "WhatsApp number not configured") deploys as-is.
        run: |
          if [ -n "$WHATSAPP_NUMBER" ]; then
            npx wrangler deploy --var "WHATSAPP_NUMBER:$WHATSAPP_NUMBER"
          else
            npx wrangler deploy
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WHATSAPP_NUMBER: ${{ vars.WHATSAPP_NUMBER }}
